name: rikkei-ss04-storex04

services:
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user_service:
        condition: service_healthy
      product_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1/users/health && wget -q -T 2 -O /dev/null http://127.0.0.1/products/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [storex]

  user_service:
    image: storex-user:latest
    build: ./user-service
    pull_policy: never
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && read -r protocol status rest <&3 && test \"$$status\" = 200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [storex]

  product_service:
    image: storex-product:latest
    build: ./product-service
    pull_policy: never
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && read -r protocol status rest <&3 && test \"$$status\" = 200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [storex]

networks:
  storex:
    driver: bridge
